<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <title>Perks — More for you</title>
  <desc>Editable 1500 by 500 banner. Blue gradient, stacked bubbles, and vector recreation of the supplied Perks symbol.</desc>
  <defs>
