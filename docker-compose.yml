services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perks
      POSTGRES_PASSWORD: perks
      POSTGRES_DB: perks
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["perks_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perks"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["perks_redis:/data"]
volumes:
  perks_db:
  perks_redis:
